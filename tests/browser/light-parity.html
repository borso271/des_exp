<!doctype html>
<html><head><meta charset="utf-8"><title>Light native/embedded verification</title>
<style>body{margin:8px;font:13px system-ui}.lab-frame,iframe{border:0;width:880px;height:424px}#embedded{width:880px;height:424px}pre{white-space:pre-wrap}</style>
</head><body><pre id="result">Checking Light artwork, controls, text, and layout…</pre>
<div id="embedded"></div><iframe id="standalone" src="../../light/"></iframe>
<script type="module">
import {createLabHost} from '../../showcase/lab-host.js';
const result=document.getElementById('result'),standalone=document.getElementById('standalone');
const host=createLabHost({container:document.getElementById('embedded')});
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const equal=(a,b,label)=>{if(JSON.stringify(a)!==JSON.stringify(b))throw Error(label);};
const wait=async fn=>{const start=performance.now();while(!fn()){if(performance.now()-start>15000)throw Error('Light did not load');await delay(30);}};
const checks=[];
try{
 host.layout({editing:false,art:{x:0,y:0,width:880,height:424}});host.setHost({paused:true});
 await host.load({lab:'light',url:'../../light/?embed=1',preset:{frame:'viewport'}});
 await wait(()=>standalone.contentWindow.volumetricLight?.getDiagnostics().ready);
 const a=host.frame.contentWindow,b=standalone.contentWindow;
 const inventory=w=>[...w.document.querySelector('#panel').querySelectorAll('input,select,button')].map(node=>({id:node.id,key:node.dataset.key,type:node.type,min:node.min,max:node.max,step:node.step,options:node.options?[...node.options].map(option=>option.value):null}));
 equal(inventory(a),inventory(b),'The embedded lab lost native controls');
 const reference=a.volumetricLight.getState();
 for(const patch of [
  {},
  {beamTint:'#aaaaff',haloTint:'#ffbb88',rotation:12,apexX:.35,zoom:1.2},
  {bloom:1.1,flareIntensity:1.8,hazeVariation:2,exposure:-.6,animate:true},
  {frame:'clean',haloScale:.8,grain:1.3}
 ]){
  const state={parameters:{...reference.parameters,...patch},time:0};
  a.volumetricLight.setState(state);b.volumetricLight.setState(state);
  for(const time of [0,2.5]){
   a.volumetricLight.renderAt(time);b.volumetricLight.renderAt(time);
   equal(a.document.querySelector('canvas').toDataURL(),b.document.querySelector('canvas').toDataURL(),'Native and embedded artwork differ');
   checks.push({frame:state.parameters.frame,time,identical:true});
  }
 }
 const state=await host.snapshot();await host.restore(JSON.parse(JSON.stringify(state)));
 equal(await host.snapshot(),state,'Full native/text JSON state changed');
 const invalid=JSON.parse(JSON.stringify(state));invalid.native.parameters.exposure=100;
 let rejected=false;try{await host.restore(invalid);}catch{rejected=true;}
 if(!rejected)throw Error('Invalid settings were accepted');
 equal(await host.snapshot(),state,'Invalid import changed the composition');

 const options=id=>[...a.document.getElementById(id).options].map(option=>option.value);
 for(const variant of ['logo','logo-renaissance','manifesto','manifesto-title','custom','none']){
  if(!options('event-copy-variant').includes(variant))throw Error('Missing text variant '+variant);
  a.PosterTextHost.setState({...a.PosterTextHost.getState(),eventCopyVariant:variant,customCopy:'LIGHT\nSTUDY'});
  equal(a.document.getElementById('poster-copy').dataset.copyVariant,variant,'Text variant did not render');
 }
 for(const effect of ['solid-white','solid-black','difference','invert']){
  a.PosterTextHost.setState({...a.PosterTextHost.getState(),eventCopyVariant:'custom',eventTextEffect:effect,logoEffect:effect});
  equal(a.document.getElementById('event-copy').dataset.textEffect,effect,'Text effect did not render');
 }
 const png=await a.volumetricLight.renderToBlob(512);
 if(png.type!=='image/png'||png.size<1000)throw Error('PNG export failed');
 a.volumetricLight.setParameters({frame:'viewport'});
 for(const layout of [
  {x:20,y:30,width:400,height:200},
  {x:12,y:10,width:330,height:160}
 ]){
  host.layout({editing:true,art:layout});await delay(120);
  const surface=a.document.getElementById('lab-art').getBoundingClientRect(),canvas=a.document.getElementById('art').getBoundingClientRect();
  for(const key of ['x','y','width','height'])if(Math.abs(surface[key]-canvas[key])>1)throw Error('Canvas does not fit the banner '+key);
 }
 result.dataset.status='passed';
 result.textContent=JSON.stringify({controls:inventory(a).length,checks,json:'exact',invalid:'atomic',text:'all shared variants and effects',png:true,layout:'canvas fits banner'},null,2);
}catch(error){result.dataset.status='failed';result.textContent=error.stack;}
</script></body></html>
