<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Living SVG Regions</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
  }

  #world {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  polygon {
    /* Optional: tiny overlap prevents subpixel seams */
    stroke: inherit;
    stroke-width: 1.5px;
    stroke-linejoin: round;
  }

  .sidebar {
    position: fixed;
    top: 16px;
    left: 16px;
    width: min(288px, calc(100vw - 32px));
    max-height: calc(100dvh - 32px);
    overflow-y: auto;
    color: #f4f4f1;
    background: rgba(22, 23, 23, .92);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 16px;
    box-shadow: 0 12px 48px rgba(0,0,0,.2);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    font: 13px/1.5 system-ui, sans-serif;
    color-scheme: dark;
  }

  button, select, input { font: inherit; }
  button, select { cursor: pointer; }
  button { color: inherit; }
  button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid #d2efb2;
    outline-offset: 4px;
  }
  .sidebar-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 18px 20px;
    border: 0;
    background: transparent;
    text-align: left;
  }
  .title { display: block; font-size: 14px; font-weight: 600; }
  .subtitle { display: block; margin-top: 2px; color: #a5a7a2; font-size: 11px; }
  .toggle-icon { font-size: 20px; color: #c6c9c0; }
  .sidebar-content { padding: 0 20px 18px; border-top: 1px solid #ffffff12; }
  .control { margin-top: 22px; }
  .control-heading { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  output { color: #d2efb2; font-variant-numeric: tabular-nums; }
  input[type="range"] { display: block; width: 100%; margin: 0; accent-color: #d2efb2; cursor: pointer; }
  .range-limits { display: flex; justify-content: space-between; margin-top: 5px; color: #92968e; font-size: 10px; }
  .hint { margin: 8px 0 0; color: #a5a7a2; font-size: 11px; }
  select { width: 100%; padding: 9px 10px; color: #f4f4f1; background: #ffffff09; border: 1px solid #ffffff26; border-radius: 8px; }
  select option { background: #222; }
  input:disabled { opacity: .35; cursor: default; }
  .sidebar-toggle { position: sticky; top: 0; z-index: 1; background: #202222; }
  .palette-preview { display: flex; gap: 4px; margin-top: 10px; }
  .palette-preview span { flex: 1; height: 16px; border-radius: 3px; }
  .actions { display: flex; gap: 8px; margin-top: 24px; }
  .actions button { flex: 1; padding: 9px 8px; border: 1px solid #ffffff26; border-radius: 8px; background: #ffffff09; }
  .actions button:hover { background: #ffffff16; }
  .actions .primary { background: #d2efb2; border-color: #d2efb2; color: #20271a; }
  .actions .primary:hover { background: #e0f6c8; }
  .shortcuts { margin: 16px 0 0; color: #a5a7a2; font-size: 10px; text-align: center; }
  kbd { font: inherit; color: #dedfd9; }
</style>
</head>

<body>

<svg
  id="world"
  xmlns="http://www.w3.org/2000/svg"
  preserveAspectRatio="none"
></svg>

<aside class="sidebar" aria-label="Animation controls">
  <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-expanded="true" aria-controls="sidebar-content" aria-label="Collapse controls">
    <span><span class="title">Moving shapes</span><span class="subtitle">A composition in motion</span></span>
    <span class="toggle-icon" aria-hidden="true">−</span>
  </button>
  <div class="sidebar-content" id="sidebar-content">
    <div class="control">
      <div class="control-heading"><label for="shape-count">Number of shapes</label><output id="shape-count-value" for="shape-count">18</output></div>
      <input id="shape-count" type="range" min="2" max="60" step="1" value="18" aria-describedby="shape-count-hint">
      <div class="range-limits" aria-hidden="true"><span>2</span><span>60</span></div>
      <p class="hint" id="shape-count-hint">Some shapes may disappear as their neighbors expand.</p>
    </div>
    <div class="control">
      <div class="control-heading"><label for="palette-type">Palette type</label></div>
      <select id="palette-type">
        <option value="random">Random</option>
        <option value="monochrome">Near monochrome</option>
        <option value="analogous">Analogous</option>
        <option value="complementary">Complementary</option>
        <option value="split">Split complementary</option>
        <option value="triadic">Triadic</option>
        <option value="ocean">Ocean</option>
        <option value="sunset">Sunset</option>
        <option value="candy">Candy</option>
        <option value="forest">Forest</option>
        <option value="neon">Neon</option>
        <option value="grayscale">Grayscale</option>
      </select>
      <div class="palette-preview" id="palette-preview" aria-hidden="true"></div>
    </div>
    <div class="control" id="base-hue-control">
      <div class="control-heading"><label for="base-hue">Base hue</label><output id="base-hue-value" for="base-hue">220°</output></div>
      <input id="base-hue" type="range" min="0" max="359" value="220" aria-describedby="base-hue-hint">
      <p class="hint" id="base-hue-hint" hidden>This preset has its own hues.</p>
    </div>
    <div class="control">
      <div class="control-heading"><label for="color-count">Color count</label><output id="color-count-value" for="color-count">8</output></div>
      <input id="color-count" type="range" min="2" max="16" value="8">
    </div>
    <div class="control">
      <div class="control-heading"><label for="color-variability">Color variability</label><output id="color-variability-value" for="color-variability">40%</output></div>
      <input id="color-variability" type="range" min="0" max="100" value="40">
    </div>
    <div class="control">
      <div class="control-heading"><label for="color-arrangement">Arrangement</label></div>
      <select id="color-arrangement" aria-describedby="arrangement-hint">
        <option value="random">Random cells</option>
        <option value="rings">By ring</option>
        <option value="sectors">By sector</option>
        <option value="checker">Checker</option>
        <option value="radial">Radial gradient</option>
      </select>
      <p class="hint" id="arrangement-hint">Patterns follow each shape’s starting position.</p>
    </div>
    <div class="actions"><button id="shuffle-palette" type="button">Shuffle palette</button></div>
    <div class="control">
      <div class="control-heading"><label for="motion-speed">Motion speed</label><output id="motion-speed-value" for="motion-speed">1.0×</output></div>
      <input id="motion-speed" type="range" min="0.1" max="3" step="0.1" value="1">
      <div class="range-limits" aria-hidden="true"><span>Slow</span><span>Fast</span></div>
    </div>
    <div class="control">
      <div class="control-heading"><label for="breathing">Size breathing</label><output id="breathing-value" for="breathing">65%</output></div>
      <input id="breathing" type="range" min="0" max="100" step="1" value="65">
      <div class="range-limits" aria-hidden="true"><span>Steady</span><span>Expressive</span></div>
    </div>
    <div class="actions">
      <button class="primary" id="pause" type="button" aria-pressed="false">Pause</button>
      <button id="regenerate" type="button">Regenerate</button>
    </div>
    <p class="shortcuts"><kbd>Space</kbd> pause / resume &nbsp; · &nbsp; <kbd>R</kbd> regenerate</p>
  </div>
</aside>

<script src="../js/shared/lab-embed.js?v=native-5" data-lab="moving"></script>
<script src="palette.js"></script>
<script src="app.js?v=embed-5"></script>

</body>
</html>
