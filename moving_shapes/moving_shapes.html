<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Living SVG Regions</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
  }

  #world {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  polygon {
    /* Optional: tiny overlap prevents subpixel seams */
    stroke: inherit;
    stroke-width: 1.5px;
    stroke-linejoin: round;
  }

  .sidebar {
    position: fixed;
    top: 16px;
    left: 16px;
    width: min(288px, calc(100vw - 32px));
    max-height: calc(100dvh - 32px);
    overflow-y: auto;
    color: #f4f4f1;
    background: rgba(22, 23, 23, .92);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 16px;
    box-shadow: 0 12px 48px rgba(0,0,0,.2);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    font: 13px/1.5 system-ui, sans-serif;
    color-scheme: dark;
  }

  button, select, input { font: inherit; }
  button, select { cursor: pointer; }
  button { color: inherit; }
  button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid #d2efb2;
    outline-offset: 4px;
  }
  .sidebar-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 18px 20px;
    border: 0;
    background: transparent;
    text-align: left;
  }
  .title { display: block; font-size: 14px; font-weight: 600; }
  .subtitle { display: block; margin-top: 2px; color: #a5a7a2; font-size: 11px; }
  .toggle-icon { font-size: 20px; color: #c6c9c0; }
  .sidebar-content { padding: 0 20px 18px; border-top: 1px solid #ffffff12; }
  .control { margin-top: 22px; }
  .control-heading { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  output { color: #d2efb2; font-variant-numeric: tabular-nums; }
  input[type="range"] { display: block; width: 100%; margin: 0; accent-color: #d2efb2; cursor: pointer; }
  .range-limits { display: flex; justify-content: space-between; margin-top: 5px; color: #92968e; font-size: 10px; }
  .hint { margin: 8px 0 0; color: #a5a7a2; font-size: 11px; }
  select { width: 100%; padding: 9px 10px; color: #f4f4f1; background: #ffffff09; border: 1px solid #ffffff26; border-radius: 8px; }
  select option { background: #222; }
  input:disabled { opacity: .35; cursor: default; }
  .sidebar-toggle { position: sticky; top: 0; z-index: 1; background: #202222; }
  .palette-preview { display: flex; gap: 4px; margin-top: 10px; }
  .palette-preview span { flex: 1; height: 16px; border-radius: 3px; }
  .actions { display: flex; gap: 8px; margin-top: 24px; }
  .actions button { flex: 1; padding: 9px 8px; border: 1px solid #ffffff26; border-radius: 8px; background: #ffffff09; }
  .actions button:hover { background: #ffffff16; }
  .actions .primary { background: #d2efb2; border-color: #d2efb2; color: #20271a; }
  .actions .primary:hover { background: #e0f6c8; }
  .shortcuts { margin: 16px 0 0; color: #a5a7a2; font-size: 10px; text-align: center; }
  kbd { font: inherit; color: #dedfd9; }
</style>
</head>

<body>

<svg
  id="world"
  xmlns="http://www.w3.org/2000/svg"
  preserveAspectRatio="none"
></svg>

<aside class="sidebar" aria-label="Animation controls">
  <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-expanded="true" aria-controls="sidebar-content" aria-label="Collapse controls">
    <span><span class="title">Moving shapes</span><span class="subtitle">A composition in motion</span></span>
    <span class="toggle-icon" aria-hidden="true">−</span>
  </button>
  <div class="sidebar-content" id="sidebar-content">
    <div class="control">
      <div class="control-heading"><label for="shape-count">Number of shapes</label><output id="shape-count-value" for="shape-count">18</output></div>
      <input id="shape-count" type="range" min="2" max="60" step="1" value="18" aria-describedby="shape-count-hint">
      <div class="range-limits" aria-hidden="true"><span>2</span><span>60</span></div>
      <p class="hint" id="shape-count-hint">Some shapes may disappear as their neighbors expand.</p>
    </div>
    <div class="control">
      <div class="control-heading"><label for="palette-type">Palette type</label></div>
      <select id="palette-type">
        <option value="random">Random</option>
        <option value="monochrome">Near monochrome</option>
        <option value="analogous">Analogous</option>
        <option value="complementary">Complementary</option>
        <option value="split">Split complementary</option>
        <option value="triadic">Triadic</option>
        <option value="ocean">Ocean</option>
        <option value="sunset">Sunset</option>
        <option value="candy">Candy</option>
        <option value="forest">Forest</option>
        <option value="neon">Neon</option>
        <option value="grayscale">Grayscale</option>
      </select>
      <div class="palette-preview" id="palette-preview" aria-hidden="true"></div>
    </div>
    <div class="control" id="base-hue-control">
      <div class="control-heading"><label for="base-hue">Base hue</label><output id="base-hue-value" for="base-hue">220°</output></div>
      <input id="base-hue" type="range" min="0" max="359" value="220" aria-describedby="base-hue-hint">
      <p class="hint" id="base-hue-hint" hidden>This preset has its own hues.</p>
    </div>
    <div class="control">
      <div class="control-heading"><label for="color-count">Color count</label><output id="color-count-value" for="color-count">8</output></div>
      <input id="color-count" type="range" min="2" max="16" value="8">
    </div>
    <div class="control">
      <div class="control-heading"><label for="color-variability">Color variability</label><output id="color-variability-value" for="color-variability">40%</output></div>
      <input id="color-variability" type="range" min="0" max="100" value="40">
    </div>
    <div class="control">
      <div class="control-heading"><label for="color-arrangement">Arrangement</label></div>
      <select id="color-arrangement" aria-describedby="arrangement-hint">
        <option value="random">Random cells</option>
        <option value="rings">By ring</option>
        <option value="sectors">By sector</option>
        <option value="checker">Checker</option>
        <option value="radial">Radial gradient</option>
      </select>
      <p class="hint" id="arrangement-hint">Patterns follow each shape’s starting position.</p>
    </div>
    <div class="actions"><button id="shuffle-palette" type="button">Shuffle palette</button></div>
    <div class="control">
      <div class="control-heading"><label for="motion-speed">Motion speed</label><output id="motion-speed-value" for="motion-speed">1.0×</output></div>
      <input id="motion-speed" type="range" min="0.1" max="3" step="0.1" value="1">
      <div class="range-limits" aria-hidden="true"><span>Slow</span><span>Fast</span></div>
    </div>
    <div class="control">
      <div class="control-heading"><label for="breathing">Size breathing</label><output id="breathing-value" for="breathing">65%</output></div>
      <input id="breathing" type="range" min="0" max="100" step="1" value="65">
      <div class="range-limits" aria-hidden="true"><span>Steady</span><span>Expressive</span></div>
    </div>
    <div class="actions">
      <button class="primary" id="pause" type="button" aria-pressed="false">Pause</button>
      <button id="regenerate" type="button">Regenerate</button>
    </div>
    <p class="shortcuts"><kbd>Space</kbd> pause / resume &nbsp; · &nbsp; <kbd>R</kbd> regenerate</p>
  </div>
</aside>

<script src="palette.js"></script>
<script>
(() => {
  "use strict";


  // ============================================================
  // CONFIG
  // ============================================================

  const CONFIG = {
    regions: 18,

    speed: 0.23,

    // Site movement.
    minAmplitude: 0.025,
    maxAmplitude: 0.10,

    // Region size breathing.
    weightMotion: 0.65,

    // Strength of weighted Voronoi effect.
    weightStrength: 0.025
  };


  // ============================================================
  // SVG
  // ============================================================

  const svg =
    document.querySelector("#world");

  const NS =
    "http://www.w3.org/2000/svg";


  let W = innerWidth;
  let H = innerHeight;

  let sites = [];
  let polygons = [];

  let paused = false;
  let time = 0;

  let previous =
    performance.now();


  // ============================================================
  // COLOR
  // ============================================================

  const paletteSettings = {
    type: "random",
    baseHue: 220,
    colorCount: 8,
    variability: 40,
    arrangement: "random",
    noise: MovingShapesPalette.makeNoise(),
    offset: 0
  };
  let palette = MovingShapesPalette.generate(paletteSettings);

  function paletteIndex(site) {
    const count = palette.length;
    // Use movement centers so colors don't jump between bands while animating.
    const dx = site.cx - 0.5;
    const dy = site.cy - 0.5;
    const radius = Math.min(1, Math.hypot(dx, dy) / Math.SQRT1_2);
    const angle = (Math.atan2(dy, dx) + Math.PI * 2) % (Math.PI * 2);
    let index;
    switch (paletteSettings.arrangement) {
      case "rings": index = Math.floor(radius * 8); break;
      case "sectors": index = Math.floor(angle / (Math.PI * 2) * count); break;
      case "checker": index = Math.floor(site.cx * 8) + Math.floor(site.cy * 8); break;
      case "radial": index = Math.round(radius * (count - 1)); break;
      default: return Math.min(count - 1, Math.floor(site.colorNoise * count));
    }
    return (index + paletteSettings.offset) % count;
  }

  function updateColors() {
    palette = MovingShapesPalette.generate(paletteSettings);
    polygons.forEach((polygon, i) => {
      const color = palette[paletteIndex(sites[i])];
      polygon.setAttribute("fill", color);
      polygon.setAttribute("stroke", color);
    });
    const preview = document.querySelector("#palette-preview");
    preview.replaceChildren(...palette.map(color => {
      const swatch = document.createElement("span");
      swatch.style.backgroundColor = color;
      return swatch;
    }));
  }


  // ============================================================
  // CREATE SITES
  // ============================================================

  function regenerate() {
    sites = [];

    svg.replaceChildren();

    polygons = [];


    for (
      let i = 0;
      i < CONFIG.regions;
      i++
    ) {
      const amplitudeX =
        CONFIG.minAmplitude +
        Math.random() *
        (
          CONFIG.maxAmplitude -
          CONFIG.minAmplitude
        );

      const amplitudeY =
        CONFIG.minAmplitude +
        Math.random() *
        (
          CONFIG.maxAmplitude -
          CONFIG.minAmplitude
        );


      const site = {
        // Movement center in normalized coordinates.
        cx:
          0.12 +
          Math.random() * 0.76,

        cy:
          0.12 +
          Math.random() * 0.76,

        ax: amplitudeX,
        ay: amplitudeY,

        // Independent frequencies.
        fx:
          0.35 +
          Math.random() * 0.6,

        fy:
          0.35 +
          Math.random() * 0.6,

        phaseX:
          Math.random() *
          Math.PI * 2,

        phaseY:
          Math.random() *
          Math.PI * 2,

        phaseX2:
          Math.random() *
          Math.PI * 2,

        phaseY2:
          Math.random() *
          Math.PI * 2,

        // Territory weighting.
        baseWeight:
          0.55 +
          Math.pow(
            Math.random(),
            1.5
          ) * 1.3,

        weightPhase:
          Math.random() *
          Math.PI * 2,

        weightSpeed:
          0.25 +
          Math.random() * 0.55,

        x: 0,
        y: 0,
        weight: 0,

        colorNoise: Math.random()
      };


      sites.push(site);


      const polygon =
        document.createElementNS(
          NS,
          "polygon"
        );

      const color =
        palette[paletteIndex(site)];

      polygon.setAttribute(
        "fill",
        color
      );

      // Same color stroke hides hairline SVG seams.
      polygon.setAttribute(
        "stroke",
        color
      );

      svg.appendChild(
        polygon
      );

      polygons.push(
        polygon
      );
    }
    updateColors();
    updateSites(time);
    render();
  }


  // ============================================================
  // SITE MOTION
  // ============================================================

  function updateSites(t) {
    const scale =
      Math.max(W, H);

    const weightScale =
      scale *
      scale *
      CONFIG.weightStrength;


    for (
      let i = 0;
      i < sites.length;
      i++
    ) {
      const s =
        sites[i];


      // Two waves per axis make the trajectories less obviously
      // circular / mechanical.

      const nx =
        s.cx +

        Math.sin(
          t * s.fx +
          s.phaseX
        ) *
        s.ax +

        Math.sin(
          t * s.fx * 0.37 +
          s.phaseX2
        ) *
        s.ax *
        0.38;


      const ny =
        s.cy +

        Math.cos(
          t * s.fy +
          s.phaseY
        ) *
        s.ay +

        Math.sin(
          t * s.fy * 0.43 +
          s.phaseY2
        ) *
        s.ay *
        0.38;


      s.x =
        Math.max(
          0,
          Math.min(
            1,
            nx
          )
        ) * W;


      s.y =
        Math.max(
          0,
          Math.min(
            1,
            ny
          )
        ) * H;


      // Territory expands / contracts independently
      // of site movement.

      const breathing =
        1 +
        Math.sin(
          t *
          s.weightSpeed +
          s.weightPhase
        ) *
        CONFIG.weightMotion;


      s.weight =
        s.baseWeight *
        breathing *
        weightScale;
    }
  }


  // ============================================================
  // POLYGON CLIPPING
  // ============================================================
  //
  // Weighted Voronoi / power diagram:
  //
  //   |p - A|² - weightA
  //       <=
  //   |p - B|² - weightB
  //
  // Expanding this produces a linear half-plane.
  //
  // Therefore each territory is an exact polygon.
  //
  // ============================================================

  function clipPolygon(
    polygon,
    A,
    B,
    C
  ) {
    if (!polygon.length) {
      return polygon;
    }


    const output = [];

    const inside = p =>
      A * p[0] +
      B * p[1]
      <= C + 0.00001;


    function intersection(
      p1,
      p2
    ) {
      const dx =
        p2[0] - p1[0];

      const dy =
        p2[1] - p1[1];


      const denominator =
        A * dx +
        B * dy;


      if (
        Math.abs(denominator)
        < 1e-12
      ) {
        return [
          p1[0],
          p1[1]
        ];
      }


      const t =
        (
          C -
          A * p1[0] -
          B * p1[1]
        ) /
        denominator;


      return [
        p1[0] +
          dx * t,

        p1[1] +
          dy * t
      ];
    }


    let previous =
      polygon[
        polygon.length - 1
      ];

    let previousInside =
      inside(previous);


    for (
      let i = 0;
      i < polygon.length;
      i++
    ) {
      const current =
        polygon[i];

      const currentInside =
        inside(current);


      if (
        currentInside
      ) {
        if (
          !previousInside
        ) {
          output.push(
            intersection(
              previous,
              current
            )
          );
        }

        output.push(
          current
        );
      }

      else if (
        previousInside
      ) {
        output.push(
          intersection(
            previous,
            current
          )
        );
      }


      previous =
        current;

      previousInside =
        currentInside;
    }


    return output;
  }


  // ============================================================
  // POWER CELL
  // ============================================================

  function calculateCell(index) {
    const s =
      sites[index];


    // Begin with the entire screen.
    let polygon = [
      [0, 0],
      [W, 0],
      [W, H],
      [0, H]
    ];


    for (
      let j = 0;
      j < sites.length;
      j++
    ) {
      if (
        j === index
      ) {
        continue;
      }


      const other =
        sites[j];


      // From:
      //
      // |p-s|² - ws <= |p-o|² - wo
      //
      // derive:
      //
      // A*x + B*y <= C

      const A =
        2 *
        (
          other.x -
          s.x
        );


      const B =
        2 *
        (
          other.y -
          s.y
        );


      const C =
        other.x * other.x +
        other.y * other.y -

        s.x * s.x -
        s.y * s.y +

        s.weight -
        other.weight;


      polygon =
        clipPolygon(
          polygon,
          A,
          B,
          C
        );


      if (
        polygon.length === 0
      ) {
        break;
      }
    }


    return polygon;
  }


  // ============================================================
  // SVG UPDATE
  // ============================================================

  function render() {
    for (
      let i = 0;
      i < sites.length;
      i++
    ) {
      const polygon =
        calculateCell(i);


      if (
        polygon.length < 3
      ) {
        polygons[i].setAttribute(
          "points",
          ""
        );

        continue;
      }


      let points = "";


      for (
        let p = 0;
        p < polygon.length;
        p++
      ) {
        points +=
          polygon[p][0].toFixed(2) +
          "," +
          polygon[p][1].toFixed(2) +
          " ";
      }


      polygons[i].setAttribute(
        "points",
        points
      );
    }
  }


  // ============================================================
  // LOOP
  // ============================================================

  function frame(now) {
    const dt =
      Math.min(
        0.05,
        (
          now -
          previous
        ) / 1000
      );

    previous = now;


    if (!paused) {
      time +=
        dt *
        CONFIG.speed;
    }


    updateSites(
      time
    );

    render();


    requestAnimationFrame(
      frame
    );
  }


  // ============================================================
  // RESIZE
  // ============================================================

  function resize() {
    W =
      Math.max(
        1,
        innerWidth
      );

    H =
      Math.max(
        1,
        innerHeight
      );


    svg.setAttribute(
      "viewBox",
      `0 0 ${W} ${H}`
    );
  }


  // ============================================================
  // INPUT
  // ============================================================

  const sidebarToggle = document.querySelector("#sidebar-toggle");
  const sidebarContent = document.querySelector("#sidebar-content");
  sidebarToggle.addEventListener("click", () => {
    const expanded = sidebarToggle.getAttribute("aria-expanded") === "true";
    sidebarToggle.setAttribute("aria-expanded", String(!expanded));
    sidebarToggle.setAttribute("aria-label", expanded ? "Expand controls" : "Collapse controls");
    sidebarToggle.querySelector(".toggle-icon").textContent = expanded ? "+" : "−";
    sidebarContent.hidden = expanded;
  });

  const typeSelect = document.querySelector("#palette-type");
  const hueInput = document.querySelector("#base-hue");
  function syncPaletteControls() {
    const fixed = MovingShapesPalette.isFixedType(paletteSettings.type);
    hueInput.disabled = fixed;
    document.querySelector("#base-hue-hint").hidden = !fixed;
  }
  typeSelect.addEventListener("change", () => {
    paletteSettings.type = typeSelect.value;
    syncPaletteControls();
    updateColors();
  });
  [
    ["base-hue", "baseHue", "°"],
    ["color-count", "colorCount", ""],
    ["color-variability", "variability", "%"]
  ].forEach(([id, key, suffix]) => {
    document.querySelector(`#${id}`).addEventListener("input", event => {
      paletteSettings[key] = Number(event.target.value);
      document.querySelector(`#${id}-value`).value = `${event.target.value}${suffix}`;
      updateColors();
    });
  });
  document.querySelector("#color-arrangement").addEventListener("change", event => {
    paletteSettings.arrangement = event.target.value;
    updateColors();
  });
  document.querySelector("#shuffle-palette").addEventListener("click", () => {
    paletteSettings.noise = MovingShapesPalette.makeNoise();
    paletteSettings.offset = Math.floor(Math.random() * 16);
    sites.forEach(site => { site.colorNoise = Math.random(); });
    updateColors();
  });
  syncPaletteControls();

  document.querySelector("#shape-count").addEventListener("input", event => {
    CONFIG.regions = Number(event.target.value);
    document.querySelector("#shape-count-value").value = CONFIG.regions;
    regenerate();
  });
  const baseSpeed = CONFIG.speed;
  document.querySelector("#motion-speed").addEventListener("input", event => {
    const multiplier = Number(event.target.value);
    CONFIG.speed = baseSpeed * multiplier;
    document.querySelector("#motion-speed-value").value = `${multiplier.toFixed(1)}×`;
    event.target.setAttribute("aria-valuetext", `${multiplier.toFixed(1)} times`);
  });
  document.querySelector("#breathing").addEventListener("input", event => {
    CONFIG.weightMotion = Number(event.target.value) / 100;
    document.querySelector("#breathing-value").value = `${event.target.value}%`;
    event.target.setAttribute("aria-valuetext", `${event.target.value} percent`);
  });

  const pauseButton = document.querySelector("#pause");
  function togglePaused() {
    paused = !paused;
    pauseButton.textContent = paused ? "Resume" : "Pause";
    pauseButton.setAttribute("aria-pressed", String(paused));
  }
  pauseButton.addEventListener("click", togglePaused);
  document.querySelector("#regenerate").addEventListener("click", regenerate);

  addEventListener(
    "keydown",
    event => {
      // Keep native keyboard behavior while operating sidebar controls.
      if (event.repeat || event.ctrlKey || event.metaKey || event.altKey ||
          event.target.closest("input, select, textarea, button, [contenteditable]")) {
        return;
      }
      if (
        event.code === "Space"
      ) {
        event.preventDefault();

        togglePaused();
      }


      if (
        event.key.toLowerCase()
        === "r"
      ) {
        regenerate();
      }
    }
  );


  addEventListener(
    "resize",
    resize
  );


  // ============================================================
  // START
  // ============================================================

  resize();
  regenerate();

  requestAnimationFrame(
    frame
  );

})();
</script>

</body>
</html>
